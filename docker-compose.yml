services:
  postgres:
    image: postgres:16-alpine
    container_name: builder_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: builder_dev_password
      POSTGRES_DB: builder_platform
    ports:
      - "5432:5432"
    volumes:
      - builder_platform_pgdata:/var/lib/postgresql/data

volumes:
  builder_platform_pgdata:
